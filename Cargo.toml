[package]
name = "mini-warehouses"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
sqlx = {version = "0.8.6",default-features = false,features = ["postgres", "runtime-tokio-rustls", "macros", "chrono", "uuid", "time",] }
dotenv = "0.15.0"
anyhow = "1.0.68"
thiserror = "2.0.18"
chrono = {version =   "0.4.24", features = ["serde","clock"] }
uuid = { version = "1.3.0", features = ["serde", "v4"] }
url = "2.2.2"
axum = {version = "0.8.8", features = ["json", "macros"] }
axum-extra = { version = "0.12.5", features = ["multipart"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
bcrypt = "0.19"
jsonwebtoken = {version = "10.3", default-features = false, features = ["use_pem","rust_crypto"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.37"
tracing-subscriber = {version =  "0.3.17", features = ["fmt", "env-filter"]}
reqwest = { version = "0.13.2",default-features = false,features = ["json", "multipart", "rustls"] }
urlencoding = "2.1.2"
